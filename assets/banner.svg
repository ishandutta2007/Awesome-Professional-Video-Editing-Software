<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="timelineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="timelineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="timelineGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="playheadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes playheadMove {
        0% { transform: translateX(0px); }
        50% { transform: translateX(820px); }
        100% { transform: translateX(0px); }
      }
      @keyframes pulseAura {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.4; }
        50% { transform: translateY(-12px) scale(1.15); opacity: 0.9; }
      }
      @keyframes shimmerWave {
        0% { opacity: 0.2; }
        50% { opacity: 0.55; }
        100% { opacity: 0.2; }
      }
      .playhead-anim {
        animation: playheadMove 12s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      .pulse-anim {
        animation: pulseAura 6s ease-in-out infinite;
        transform-origin: center;
      }
      .float-p1 { animation: floatParticle 5s ease-in-out infinite; }
      .float-p2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
      .float-p3 { animation: floatParticle 6s ease-in-out infinite 3s; }
      .shimmer-track { animation: shimmerWave 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="356" x="2" y="2" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Light Orbs (Background) -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="pulse-anim" />
  <circle cx="1000" cy="180" r="180" fill="#a855f7" opacity="0.12" filter="url(#glow)" class="pulse-anim" />
  <circle cx="600" cy="300" r="120" fill="#06b6d4" opacity="0.08" filter="url(#glow)" />

  <!-- Animated Particles -->
  <circle cx="150" cy="120" r="3" fill="#38bdf8" class="float-p1" />
  <circle cx="1050" cy="90" r="4" fill="#c084fc" class="float-p2" />
  <circle cx="920" cy="270" r="2.5" fill="#38bdf8" class="float-p3" />
  <circle cx="320" cy="50" r="2" fill="#818cf8" class="float-p2" />

  <!-- Timeline Interface Decoration (Bottom Third, Behind Foreground Text) -->
  <g transform="translate(140, 245)">
    <!-- Timeline Container Frame -->
    <rect x="0" y="0" width="920" height="85" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    
    <!-- Timeline Ruler Markers -->
    <line x1="20" y1="12" x2="900" y2="12" stroke="#334155" stroke-width="1" stroke-dasharray="2 18" />
    <text x="30" y="10" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">00:00:00:00</text>
    <text x="250" y="10" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">00:00:15:00</text>
    <text x="470" y="10" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">00:00:30:00</text>
    <text x="690" y="10" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">00:00:45:00</text>
    
    <!-- Track V2 (Clips & FX) -->
    <rect x="25" y="18" width="180" height="18" rx="4" fill="url(#timelineGrad2)" class="shimmer-track" />
    <rect x="220" y="18" width="290" height="18" rx="4" fill="url(#timelineGrad2)" />
    <rect x="530" y="18" width="160" height="18" rx="4" fill="url(#timelineGrad2)" />
    <rect x="710" y="18" width="180" height="18" rx="4" fill="url(#timelineGrad2)" class="shimmer-track" />

    <!-- Track V1 (Main Footage) -->
    <rect x="25" y="40" width="240" height="18" rx="4" fill="url(#timelineGrad1)" />
    <rect x="280" y="40" width="210" height="18" rx="4" fill="url(#timelineGrad1)" class="shimmer-track" />
    <rect x="505" y="40" width="260" height="18" rx="4" fill="url(#timelineGrad1)" />
    <rect x="780" y="40" width="110" height="18" rx="4" fill="url(#timelineGrad1)" />

    <!-- Track A1 (Audio Waveforms) -->
    <rect x="25" y="62" width="370" height="16" rx="4" fill="url(#timelineGrad3)" />
    <rect x="410" y="62" width="280" height="16" rx="4" fill="url(#timelineGrad3)" class="shimmer-track" />
    <rect x="705" y="62" width="185" height="16" rx="4" fill="url(#timelineGrad3)" />

    <!-- Animated Playhead Line -->
    <g class="playhead-anim">
      <line x1="50" y1="2" x2="50" y2="82" stroke="url(#playheadGrad)" stroke-width="2" filter="url(#softGlow)" />
      <polygon points="44,2 56,2 50,10" fill="#f43f5e" />
    </g>
  </g>

  <!-- Foreground Badge / Pill -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#38bdf8" />
    <text x="28" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Foreground Title -->
  <text x="60" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
    Professional Video Editing Software
  </text>

  <!-- Foreground Highlight / Gradient Subheading -->
  <text x="60" y="165" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="20" font-weight="700">
    Commercial NLE Suites &amp; Production-Grade Open-Source Engines
  </text>

  <!-- Foreground Subtext -->
  <text x="60" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="14" font-weight="400">
    Non-linear timeline editing • GPU-accelerated effects • Multi-camera sync • Color grading • Fairlight audio
  </text>

  <!-- Decorative Corner Icon (Film / Slate Reel) -->
  <g transform="translate(1080, 45)" opacity="0.6">
    <rect x="0" y="0" width="56" height="42" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <polygon points="22,13 38,21 22,29" fill="#38bdf8" />
    <line x1="0" y1="10" x2="56" y2="10" stroke="#334155" stroke-width="1" />
    <line x1="12" y1="0" x2="18" y2="10" stroke="#334155" stroke-width="1" />
    <line x1="28" y1="0" x2="34" y2="10" stroke="#334155" stroke-width="1" />
    <line x1="44" y1="0" x2="50" y2="10" stroke="#334155" stroke-width="1" />
  </g>
</svg>
